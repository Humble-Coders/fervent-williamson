  # Upload Endpoints
  /upload/image:
    post:
      tags:
        - Upload
      summary: Upload a single image
      description: Upload a single image file (requires authentication)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file to upload (max 10MB)
      responses:
        '200':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      image:
                        type: string
                        example: "/uploads/image-123456789.jpg"
                  message:
                    type: string
                    example: "Image uploaded successfully"
        '400':
          description: No image provided or invalid file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File too large (max 10MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /upload/images:
    post:
      tags:
