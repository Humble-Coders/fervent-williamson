  # Booking Endpoints
  /bookings:
    post:
      tags:
        - Bookings
      summary: Create a new booking
      description: Create a new booking (requires authentication)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - salonId
                - serviceId
                - date
                - time
              properties:
                salonId:
                  type: string
                  example: "856b2dee-18d6-407b-aa9b-1e30af346044"
                serviceId:
                  type: string
                  example: "a3e99e2f-7399-4c25-96de-c680e38e0ab4"
                stylistId:
                  type: string
                  nullable: true
                  example: "stylist-uuid"
                date:
                  type: string
                  format: date
                  example: "2025-01-15"
                time:
                  type: string
                  example: "14:30"
                notes:
                  type: string
                  example: "Please call before arriving"
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Booking'
                  message:
                    type: string
                    example: "Booking created successfully"
        '400':
          description: Validation error or booking conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bookings/user/{userId}:
    get:
      tags:
        - Bookings
      summary: Get user's bookings
      description: Retrieve all bookings for a specific user (requires authentication)
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User bookings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bookings/availability:
    get:
      tags:
        - Bookings
      summary: Get available time slots
      description: |
        Get available time slots for booking at a specific CutQ for a given date.
        Supports filtering by service and stylist for more accurate availability.
      parameters:
        - name: salonId
          in: query
          required: true
          description: CutQ ID
          schema:
            type: string
            example: "856b2dee-18d6-407b-aa9b-1e30af346044"
        - name: serviceId
          in: query
          required: true
          description: Service ID
          schema:
            type: string
            example: "a3e99e2f-7399-4c25-96de-c680e38e0ab4"
        - name: stylistId
          in: query
          description: Specific stylist ID (optional)
          schema:
            type: string
            example: "stylist-uuid"
        - name: date
          in: query
          required: true
          description: Date for availability check (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-01-15"
      responses:
        '200':
          description: Available time slots retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      availableSlots:
                        type: array
                        items:
                          type: string
                        example: ["09:00", "09:30", "10:00", "14:00", "15:30"]
                      date:
                        type: string
                        format: date
                        example: "2025-01-15"
                      salonWorkingHours:
                        type: object
                        properties:
                          open:
                            type: string
                            example: "09:00"
                          close:
                            type: string
                            example: "18:00"
                  message:
                    type: string
                    example: "Available time slots retrieved successfully"
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bookings/{id}/status:
    patch:
      tags:
        - Bookings
      summary: Update booking status
      description: |
        Update booking status with verification code support. Used for confirming
        appointments when customers arrive at the CutQ.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Booking ID
          schema:
            type: string
            example: "booking-uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, cancelled, completed]
                  example: "completed"
                verificationCode:
                  type: string
                  description: Required when marking booking as completed
                  example: "ABC123"
                notes:
                  type: string
                  description: Optional notes for status change
                  example: "Customer arrived on time"
      responses:
        '200':
          description: Booking status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Booking'
                  message:
                    type: string
                    example: "Booking status updated successfully"
        '400':
          description: Invalid verification code or status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

